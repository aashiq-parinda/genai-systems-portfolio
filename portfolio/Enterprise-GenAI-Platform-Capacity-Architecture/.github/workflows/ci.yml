name: CI - Enterprise GenAI Platform & Capacity Architecture

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r portfolio/Enterprise-GenAI-Platform-Capacity-Architecture/requirements.txt

    - name: Run Pytest Suite
      run: |
        PYTHONPATH=portfolio/Enterprise-GenAI-Platform-Capacity-Architecture pytest portfolio/Enterprise-GenAI-Platform-Capacity-Architecture/tests -v

    - name: Export Verified Receipts
      run: |
        cd portfolio/Enterprise-GenAI-Platform-Capacity-Architecture
        PYTHONPATH=. python src/cli.py export-receipts
